# Fork-only: builds an iOS Simulator app without secrets (no signing, no Intune).
name: fork-ios-simulator

on:
  push:
    branches:
      - ios-sim-build
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fork-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Prepare iOS Build
        uses: ./.github/actions/prepare-ios-build
        with:
          intune-enabled: 'false'

      - name: Build iOS Simulator
        run: bundle exec fastlane ios simulator --env ios.simulator
        working-directory: ./fastlane

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator-${{ github.sha }}
          path: Mattermost-simulator-*.app.zip
